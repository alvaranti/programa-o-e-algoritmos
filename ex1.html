<script>
    let vetorA = [];
    for (let i = 0; i < 10; i++) {
        vetorA[i] = parseInt(prompt("Entre com o " + (i+1) + "o. valor de A:"));
    }

    let vetorB = [];
    for (let i = 0; i < 10; i++) {
        vetorB[i] = vetorA[i] * vetorA[i];
    }

    document.write("Vetor A: ", vetorA + "<br><br>");
    document.write("Vetor B (quadrados): ", vetorB);
</script>
