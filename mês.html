<script>
    var mes = parseInt(prompt("escreva o numero do mes"));
    switch(mes){
        case 1:
        case 3:
        case 5:
        case 7:
        case 8:
        case 10:
        case 12:
            alert("31 Dias");
            break;
        case 4:
        case 6:
        case 9:
        case 11:
            alert("30 Dias");
            break;
        case 2:
            alert("28 dias");
            break;
        default:
            alert("mês inválido");
    }
</script>
