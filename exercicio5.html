<script>
let numeros = [];
let pares = 0;
let impares = 0;

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite o numero inteiro " + (i + 1) + " de 10:"));
}

for (let i = 0; i < 10; i++) {
    if (numeros[i] % 2 == 0) {
        pares++;
    } else {
        impares++;
    }
}

alert("Quantidade de numeros pares: " + pares + "\nQuantidade de numeros impares: " + impares);
</script>
