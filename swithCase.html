<script>
    var placa = parseInt(prompt("escreva o último número da placa"));
    switch(placa){
        case 0:
        case 9:
            alert("Sexta-feira");
            break;
        case 1:
        case 2: 
            alert("Segunda");
            break;
        case 3:
        case 4:
            alert("Terça-feira");
            break;
        case 5:
        case 6:
            alert("Quarta-feira");
            break;
        case 7:
        case 8:
            alert("quinta-feira");
            break;
        default:
            alert("placa inválida")
    }
    


</script>
