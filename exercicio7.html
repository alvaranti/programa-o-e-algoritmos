<script>
let numeros = [];

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite o numero inteiro " + (i + 1) + " de 10:"));
}

let resultado = "Numeros na ordem inversa:\n";
for (let i = 9; i >= 0; i--) {
    resultado = resultado + numeros[i] + "\n";
}
alert(resultado);
</script>
