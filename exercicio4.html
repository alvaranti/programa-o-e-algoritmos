<script>
let numeros = [];

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite o numero inteiro " + (i + 1) + " de 10:"));
}

let maior = numeros[0];
let menor = numeros[0];

for (let i = 1; i < 10; i++) {
    if (numeros[i] > maior) {
        maior = numeros[i];
    }
    if (numeros[i] < menor) {
        menor = numeros[i];
    }
}

alert("Maior numero: " + maior + "\nMenor numero: " + menor);
</script>
